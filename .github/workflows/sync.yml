name: Snapshot sync

on:
  schedule:
    - cron: "0 4 * * 1" # weekly, Monday 04:00 UTC
  workflow_dispatch:
  pull_request:
    paths:
      - "scripts/deprecation-sources.yaml"
      - "data/dead-packages.json"
      - "src/lang_fossil/data/dead-packages.json"

permissions: { contents: read }

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      # The sync script only needs pyyaml + stdlib (offline `check` mode).
      - run: pip install pyyaml
      - name: Snapshots must match the curated manifest
        run: python scripts/sync_deprecations.py check
