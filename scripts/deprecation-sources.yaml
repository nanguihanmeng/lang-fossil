# Curated deprecation/removal manifest (source of truth).
#
# `scripts/sync_deprecations.py` regenerates the versioned offline snapshots
# (data/dead-packages.json and src/lang_fossil/data/dead-packages.json) from
# this file -- the runtime stays offline-first and reads only JSON.
#
# How to maintain (after each CPython release):
#   1. Add/update entries here with the removal evidence (removal tag, year).
#   2. Run `python scripts/sync_deprecations.py verify` to check each entry
#      that carries a `ref_url` against the official documentation.
#   3. Run `python scripts/sync_deprecations.py write` to regenerate both
#      snapshot copies with a bumped snapshot_version.
# Never edit the generated JSON files by hand.
#
# Entry fields mirror the dead-packages.json schema: module is required;
# attribute, removed_in, removal, replacement are optional per entry.
schema_version: 1
sources:
  - name: CPython What's New index (curated removal evidence)
    url: https://docs.python.org/3/whatsnew/index.html
    version: "3.14"
packages:
  - module: distutils
    removed_in: "3.12"
    removal: pep632
    replacement: "setuptools / sysconfig / packaging"
  - module: imp
    removed_in: "3.12"
    removal: pep594-adjacent
    replacement: importlib
  - module: asyncore
    removed_in: "3.12"
    removal: pep594
    replacement: asyncio
  - module: asynchat
    removed_in: "3.12"
    removal: pep594
    replacement: asyncio
  - module: smtpd
    removed_in: "3.12"
