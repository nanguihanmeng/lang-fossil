[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"

[project]
name = "lang-fossil"
version = "0.4.0"
description = "Archaeology for codebases: detect fossilized legacy APIs and dead code across language eras."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "lang-fossil contributors" }]
requires-python = ">=3.9"
keywords = ["linter", "legacy-code", "static-analysis", "archaeology"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "typer>=0.12",
    "rich>=13",
    "jinja2>=3.1",
    "pyyaml>=6",
    "parso>=0.8,<0.10",
    "pydantic-settings>=2.2",
]

[project.optional-dependencies]
git = ["GitPython>=3.1"]

[project.scripts]
lang-fossil = "lang_fossil.cli.app:main"

[project.urls]
Homepage = "https://github.com/lang-fossil/lang-fossil"
Changelog = "https://github.com/lang-fossil/lang-fossil/blob/main/CHANGELOG.md"

[tool.pdm]
distribution = true

[tool.pdm.dev-dependencies]
test = ["pytest>=8", "pytest-cov>=5"]
lint = ["ruff>=0.6", "black>=24.8", "mypy>=1.11"]

[tool.black]
line-length = 100
target-version = ["py39"]
extend-exclude = "tests/golden/corpus" # intentional Py2 corpora, not formattable

[tool.ruff]
line-length = 100
target-version = "py39"
src = ["src", "tests"]
extend-exclude = [
    "tests/golden/corpus", # intentional legacy-syntax corpora (Py2)
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort import ordering
    "B",   # flake8-bugbear
    "UP",  # pyupgrade (dogfood)
    "S",   # bandit (rule loading must be defensive)
    "SIM", # simplification
    "D",   # pydocstyle (Google convention, see docs)
    "ANN", # annotation completeness
    "PL",  # pylint subset
]
ignore = [
    "S101",    # tests are allowed to use assert
    "ANN401",  # Any is legitimate at the TOML/env config boundary
    "B008",    # typer relies on function calls in parameter defaults
    "PLC0415", # lazy imports are deliberate (optional deps, CLI dispatch)
]
per-file-ignores = { "tests/**" = ["S", "D", "ANN", "PLR2004"], "src/lang_fossil/cli/**" = ["D301", "PLR0913", "PLR0917"], "src/lang_fossil/infra/git_service.py" = ["S603", "S607"] }

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
strict = true
# mypy >= 1.19 dropped the 3.9 target; 3.10 is the lowest supported.
python_version = "3.10"
mypy_path = "src"
packages = ["lang_fossil"]

[[tool.mypy.overrides]]
# Untyped third-party front ends; interactions are wrapped behind typed helpers.
module = ["parso.*", "yaml.*", "tomllib", "tomli"]
ignore_missing_imports = true
implicit_reexport = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "golden: golden corpus regression tests (release gate)",
]
addopts = "-ra"

[tool.coverage.run]
branch = true
source = ["lang_fossil"]
